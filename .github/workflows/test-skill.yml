name: Test skill package

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/**"
      - "example/**"
      - ".github/workflows/test-skill.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/**"
      - "example/**"
      - ".github/workflows/test-skill.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: scripts/validate-skill.sh
      - run: RUN_UPSTREAM_INTEGRATION=1 scripts/integration-test.sh
